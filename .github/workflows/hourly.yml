name: Hourly Clinical Trial Scraper

on:
  schedule:
    # Beat-the-hour: run at minute 58 every hour UTC
    - cron: "58 * * * *"
  workflow_dispatch:
    inputs:
      hour_utc:
        description: "Override UTC hour for sector rotation (0-23)"
        required: false
        type: string
      dry_run:
        description: "Skip email alerts"
        required: false
        type: boolean
        default: true

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train classifier if missing
        run: python -m src.ml.train

      - name: Run hourly pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WATCHLIST_LLM_MODEL: ${{ vars.WATCHLIST_LLM_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          FAVORABILITY_THRESHOLD: ${{ vars.FAVORABILITY_THRESHOLD }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.hour_utc }}" ]; then
            ARGS="$ARGS --hour-utc ${{ github.event.inputs.hour_utc }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.pipeline.run_hourly $ARGS

      - name: Commit snapshot updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.db data/watchlist_digest.json models/favorability.pkl || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update trial snapshots [skip ci]"
            git push
          fi
